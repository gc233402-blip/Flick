name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [CONTRIBUTING.md](https://github.com/moss-apps/Flick/blob/main/CONTRIBUTING.md)
        first — the audio path is opinionated by design, and the project is
        scope-conscious.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: This does not silently resample or truncate audio output
          required: true
        - label: This does not add ads, tracking, or a premium tier
          required: true
        - label: This does not add desktop or iOS paths (Android-only, minSdk 26)
          required: true
